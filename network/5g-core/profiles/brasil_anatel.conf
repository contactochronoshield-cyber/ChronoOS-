# ChronoOS 5G - Perfil regulatorio Brasil (ANATEL)
# Parametros de referencia segun Ato 915/2024 y regulacion vigente para
# Servico Limitado Privado. VERIFICAR SIEMPRE contra la normativa actual
# de ANATEL antes de cualquier despliegue real - esto es punto de partida
# para estudio, NO sustituye asesoria de homologacion profesional.

REGULATOR=ANATEL
COUNTRY=BR
LICENSE_TYPE=Servico_Limitado_Privado

# Bandas recomendadas segun sector (Sub-1GHz para mayor alcance/penetracion)
BAND_MINERIA=Sub-1GHz
BAND_AGRONEGOCIO=Sub-1GHz
BAND_UTILITIES=Sub-1GHz

# Limites tecnicos documentados (Ato 915/2024)
MAX_ANTENNA_HEIGHT_OUTDOOR_M=6
MAX_TX_POWER_TERMINAL_W=25

# Referencia de costo publico (verificar valor actual en ANATEL)
REFERENCE_FEE_EXAMPLE="R$860,30 - 100MHz, 1km radio, 10 anos (Sao Paulo, 3.75GHz)"

# ADVERTENCIA OBLIGATORIA
HOMOLOGACAO_REQUIRED=true
HOMOLOGACAO_NOTE="Todo equipamento com radiofrequencia DEVE ser homologado pela ANATEL antes de venda/operacao. Multas: R$110 a R$50 milhoes (Resolucao 715/2019 + 780/2025). Consultar OCD (Organismo de Certificacao Designado) antes de qualquer implantacao."
