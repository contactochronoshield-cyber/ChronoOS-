name: android-demo
on:
  workflow_dispatch:
  push:
    tags: ['demo-v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android-demo assembleDebug --no-daemon
      - run: |
          mkdir -p out
          cp android-demo/app/build/outputs/apk/debug/app-debug.apk out/chronoos-demo.apk
          (cd out && sha256sum chronoos-demo.apk > chronoos-demo.apk.sha256)
      - uses: actions/upload-artifact@v4
        with: { name: chronoos-demo-apk, path: out/* }
      - if: startsWith(github.ref, 'refs/tags/demo-v')
        uses: softprops/action-gh-release@v2
        with: { files: out/* }
