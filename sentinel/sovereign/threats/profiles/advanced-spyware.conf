# ChronoOS Advanced Spyware Threat Profile
# Defensive detection profile.
# Known indicators must be added only from verified threat intelligence.

[profile]
name=advanced-spyware
enabled=true

[detection]
process_anomaly=true
privilege_anomaly=true
integrity_anomaly=true
network_anomaly=true
persistence_anomaly=true
sensor_anomaly=true
forensic_correlation=true

[targets]
pegasus=true
other_advanced_spyware=true
unknown_spyware=true

[response]
automatic_remediation=false
automatic_network_block=false
automatic_process_termination=false
evidence_preservation=true
