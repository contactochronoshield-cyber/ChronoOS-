# ChronoOS Modbus Guard - Whitelist de registros seguros
# Formato: function_code,register_addr,min_value,max_value,etiqueta
#
# Ejemplo real inspirado en el caso Oldsmar 2021: dosificacion de hidroxido
# de sodio (sosa caustica) en tratamiento de agua. El ataque subio el valor
# de ~100ppm a 11100ppm. Esta regla bloquea cualquier valor fuera del rango
# seguro operativo, sin importar de donde venga el comando.
6,100,80,150,DOSIFICACION_NAOH_PPM
6,101,0,10,DOSIFICACION_CLORO_PPM
5,200,0,1,VALVULA_ENTRADA_PRINCIPAL
3,300,0,0,LECTURA_NIVEL_TANQUE
