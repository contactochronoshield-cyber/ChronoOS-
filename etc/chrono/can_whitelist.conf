# ChronoOS CAN Guard - Whitelist de mensajes CAN legitimos
# Formato: can_id_hex,min_byte0,max_byte0,sistema,descripcion
# Basado en IDs comunes documentados en repositorios publicos de
# ingenieria inversa CAN (no es propietario de ningun fabricante)

# Motor
0C0,0,250,engine,RPM del motor
130,0,200,engine,Carga del motor
180,0,100,engine,Temperatura refrigerante

# Frenos
1A0,0,100,brake,Presion de freno
1B0,0,1,brake,ABS activo

# Direccion
0E0,0,10,steering,Angulo de direccion
0F0,0,50,steering,Torque de direccion

# Velocidad
002,0,250,speed,Velocidad del vehiculo
AA0,0,250,speed,Velocidad rueda delantera izq

# Transmision
1D0,0,8,transmission,Posicion de marcha
